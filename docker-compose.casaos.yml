name: prekduadara

services:
  mariadb:
    image: mariadb:11
    container_name: prekduadara-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ganti_root_password_kuat
      MARIADB_DATABASE: prekduadara_db
      MARIADB_USER: prekuser
      MARIADB_PASSWORD: ganti_user_password_kuat
      TZ: Asia/Jakarta
    volumes:
      - /DATA/AppData/prekduadara/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    image: ghcr.io/mimthokwes/ayradd-back-prek:latest
    container_name: prekduadara-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      TZ: Asia/Jakarta
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: prekuser
      DB_PASSWORD: ganti_user_password_kuat
      DB_NAME: prekduadara_db
      AUTO_INIT_DB: "true"
      JWT_SECRET: ganti_jwt_secret_panjang_dan_acak
      JWT_ACCESS_EXPIRES_IN: 1d
      JWT_REFRESH_SECRET: ganti_jwt_refresh_secret_panjang_dan_acak
      JWT_REFRESH_EXPIRES_IN: 7d
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash-lite
    volumes:
      - /DATA/AppData/prekduadara/uploads:/app/uploads
